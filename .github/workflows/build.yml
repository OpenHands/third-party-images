name: Build images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - images.json
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: read
        run: echo "images=$(jq -c . images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.image.name }}:${{ matrix.image.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference
        id: ref
        env:
          NAME: ${{ matrix.image.name }}
          TAG: ${{ matrix.image.tag }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}:${TAG}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Tags are immutable: rebuilding needs a new tag in images.json.
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref already exists; skipping"
          fi
      - if: steps.ref.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - if: steps.ref.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: steps.ref.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.ref.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - if: steps.ref.outputs.exists != 'true'
        name: Summary
        env:
          REF: ${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '`%s@%s`\n' "$REF" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
